# build-ios.yml — build .ipa TANPA tanda tangan di runner macOS GitHub.
#
# KENAPA TANPA TANDA TANGAN (unsigned):
# Menandatangani butuh sertifikat Apple Developer yang terikat akun — kalau
# disimpan sebagai GitHub Secret, itu berarti kredensial Apple ID ada di cloud
# pihak ketiga. Untuk alur "GitHub Actions build + Sideloadly install", kita
# sengaja BIARKAN unsigned di sini; Sideloadly yang menandatangani NANTI, di
# laptop sendiri, pakai Apple ID gratis. Lebih aman dan lebih sederhana.
#
# CARA MEMICU: buka tab Actions di GitHub, pilih workflow ini, klik
# "Run workflow" (workflow_dispatch) — atau otomatis tiap push ke main.

name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DroneStackBridge/**"
      - "Podfile"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    # Pin runner, JANGAN "macos-latest" — Apple/GitHub mengganti image default
    # tanpa pemberitahuan, dan itu bisa mematahkan build tanpa ada satu baris
    # pun kode yang berubah di sisi kita.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Pilih Xcode TERBARU yang tersedia di runner
        # BUKAN versi tetap (mis. Xcode_15.4.app). Alasannya bukti nyata, bukan
        # teori: run pertama workflow ini gagal karena XcodeGen dari Homebrew
        # SELALU memakai versi terbarunya sendiri dan menulis format project
        # (object version) mengikuti Xcode TERBARU yang ia kenal — sementara kita
        # memaksa `xcode-select` ke Xcode 15.4, yang gagal membuka format itu
        # ("cannot be opened because it is in a future Xcode project file
        # format"). Runner macos-14 GitHub biasanya menyediakan beberapa versi
        # Xcode sekaligus; baris ini memilih yang paling baru secara otomatis
        # supaya dua alat itu (XcodeGen & Xcode) selalu sejalan, apa pun versi
        # yang sedang dikirim GitHub bulan ini.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE=/Applications/Xcode.app; fi
          echo "Memilih: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Hasilkan project Xcode dari project.yml
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          # Kunci cache dari isi Podfile — cache basi otomatis dibuang begitu
          # daftar pod berubah, tanpa perlu dibersihkan manual.
          key: pods-${{ hashFiles('Podfile') }}

      - name: Pasang pod (DJI-SDK-iOS)
        run: pod install --repo-update

      - name: Build & archive (tanpa tanda tangan)
        run: |
          xcodebuild archive \
            -workspace DroneStackBridge.xcworkspace \
            -scheme DroneStackBridge \
            -configuration Release \
            -archivePath build/DroneStackBridge.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Bungkus jadi .ipa
        run: |
          set -e
          APP_PATH="build/DroneStackBridge.xcarchive/Products/Applications"
          test -d "$APP_PATH"/*.app
          mkdir -p build/Payload
          cp -r "$APP_PATH"/*.app build/Payload/
          cd build && zip -qr DroneStackBridge-unsigned.ipa Payload

      - name: Unggah .ipa sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneStackBridge-unsigned
          path: build/DroneStackBridge-unsigned.ipa
          # .ipa tanpa tanda tangan hanya berguna sesaat (dipakai lalu
          # ditandatangani ulang Sideloadly setiap minggu) — tidak perlu
          # disimpan berbulan-bulan di GitHub.
          retention-days: 14
