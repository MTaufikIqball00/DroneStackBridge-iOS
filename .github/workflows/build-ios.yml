# build-ios.yml — build .ipa TANPA tanda tangan di runner macOS GitHub.
#
# KENAPA TANPA TANDA TANGAN (unsigned):
# Menandatangani butuh sertifikat Apple Developer yang terikat akun — kalau
# disimpan sebagai GitHub Secret, itu berarti kredensial Apple ID ada di cloud
# pihak ketiga. Untuk alur "GitHub Actions build + Sideloadly install", kita
# sengaja BIARKAN unsigned di sini; Sideloadly yang menandatangani NANTI, di
# laptop sendiri, pakai Apple ID gratis. Lebih aman dan lebih sederhana.
#
# CARA MEMICU: buka tab Actions di GitHub, pilih workflow ini, klik
# "Run workflow" (workflow_dispatch) — atau otomatis tiap push ke main.

name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DroneStackBridge/**"
      - "Podfile"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    # macos-15, BUKAN macos-14.
    #
    # Ini keputusan berdasarkan kegagalan nyata, bukan preferensi: dua run
    # pertama gagal dengan "The project cannot be opened because it is in a
    # future Xcode project file format (77)". XcodeGen dari Homebrew selalu
    # versi terbaru dan menulis format project 77, yang hanya bisa dibaca
    # Xcode 16.3+. Image macos-14 TIDAK memuat Xcode 16 sama sekali — Xcode
    # tertingginya 15.4 — sehingga memilih "Xcode terbaru yang tersedia" pun
    # tetap menghasilkan 15.4 dan tetap gagal. Yang perlu diganti image-nya,
    # bukan cara memilih Xcode-nya.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Pilih Xcode TERBARU yang tersedia di runner
        # DEVELOPER_DIR ikut ditulis ke GITHUB_ENV, tidak cukup `xcode-select`
        # saja: bila runner menetapkan DEVELOPER_DIR, variabel itu MENANG atas
        # xcode-select dan langkah build berikutnya diam-diam memakai Xcode lama
        # — persis gejala yang bikin run kedua tetap memanggil Xcode_15.4
        # padahal langkah pemilihannya dilaporkan sukses.
        #
        # Daftar Xcode ikut dicetak supaya kalau suatu saat gagal lagi, versi
        # yang benar-benar tersedia langsung kelihatan di log tanpa menebak.
        run: |
          echo "Xcode yang tersedia di runner ini:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE=/Applications/Xcode.app; fi
          echo "Memilih: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          echo "DEVELOPER_DIR=$LATEST_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$LATEST_XCODE/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Hasilkan project Xcode dari project.yml
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          # Kunci cache dari isi Podfile — cache basi otomatis dibuang begitu
          # daftar pod berubah, tanpa perlu dibersihkan manual.
          key: pods-${{ hashFiles('Podfile') }}

      - name: Pasang pod (DJI-SDK-iOS)
        run: pod install --repo-update

      # Kedua langkah di bawah menerbitkan ringkasan hasilnya sebagai ANOTASI
      # (`::notice::` / `::error::`), bukan sekadar menulis ke log.
      #
      # Alasannya praktis: mengunduh log mentah lewat API menuntut hak admin
      # repo, sedangkan anotasi bisa dibaca siapa pun lewat API publik. Tanpa
      # ini, setiap kegagalan harus disalin-tempel manual dari browser sebelum
      # bisa didiagnosis — dan itu sudah terjadi tiga kali.
      - name: Diagnostik workspace (skema yang terbaca Xcode)
        run: |
          xcodebuild -list -workspace DroneStackBridge.xcworkspace > /tmp/list.txt 2>&1 || true
          cat /tmp/list.txt
          head -20 /tmp/list.txt | while IFS= read -r l; do echo "::notice::LIST ${l}"; done

      - name: Build & archive (tanpa tanda tangan)
        run: |
          set -o pipefail
          if ! xcodebuild archive \
            -workspace DroneStackBridge.xcworkspace \
            -scheme DroneStackBridge \
            -configuration Release \
            -archivePath build/DroneStackBridge.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee /tmp/build.log
          then
            # Galat kompilasi Swift muncul sebagai baris "...error: ...".
            grep -E "error:" /tmp/build.log | head -6 \
              | while IFS= read -r l; do echo "::error::${l}"; done
            # Beberapa kegagalan (mis. skema/workspace) tidak memakai kata
            # "error:", jadi ekor log ikut diterbitkan sebagai jaring pengaman.
            tail -4 /tmp/build.log \
              | while IFS= read -r l; do echo "::error::EKOR ${l}"; done
            exit 1
          fi

      - name: Bungkus jadi .ipa
        run: |
          set -e
          APP_PATH="build/DroneStackBridge.xcarchive/Products/Applications"
          test -d "$APP_PATH"/*.app
          mkdir -p build/Payload
          cp -r "$APP_PATH"/*.app build/Payload/
          cd build && zip -qr DroneStackBridge-unsigned.ipa Payload

      - name: Unggah .ipa sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneStackBridge-unsigned
          path: build/DroneStackBridge-unsigned.ipa
          # .ipa tanpa tanda tangan hanya berguna sesaat (dipakai lalu
          # ditandatangani ulang Sideloadly setiap minggu) — tidak perlu
          # disimpan berbulan-bulan di GitHub.
          retention-days: 14
